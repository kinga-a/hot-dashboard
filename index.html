<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>热点聚合看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 18l5-7 4 5 5-7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('board_theme')||'light'}catch(e){}})();</script>
<style>
  /* Aurora Glass · 热点聚合看板主题（双主题：默认浅色 Light-Aurora，可切深色 Aurora-Night）
   * 参考 uiverse：
   *  - SteveBloX/dangerous-warthog-85 —— 毛玻璃卡片 + hover 放大/描边高亮 + active 回弹
   *  - JustCode14/unlucky-owl-60      —— 3D 翻转微交互（同款 cubic-bezier(.61,.98,.48,1.01)）
   *  - ilkhoeri/curvy-newt-49         —— 平滑展开列表 + hover 才浮现的 8px 圆角细滚动条
   */
  :root{
    /* ===== Light-Aurora（默认）===== */
    --cs:light;
    --bg:#eef1f8;
    --aurora:
      radial-gradient(46% 38% at 12% 0%, rgba(99,102,241,.2), transparent 65%),
      radial-gradient(38% 32% at 88% 8%, rgba(190,84,226,.15), transparent 65%),
      radial-gradient(44% 38% at 55% 102%, rgba(34,197,214,.16), transparent 65%);
    --grid:rgba(37,53,94,.08);
    --ink:#1c2333;--muted:#546179;--faint:#6f7b94;
    --hair:rgba(23,32,61,.16);--hair-soft:rgba(23,32,61,.08);--hair-hi:rgba(23,32,61,.45);
    --chip-bg:rgba(255,255,255,.72);--chip-bg2:rgba(23,32,61,.05);
    --glass:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.82) 55%,rgba(255,255,255,.72));
    --panel-bg:rgba(255,255,255,.94);
    --row-hover:rgba(37,53,94,.055);--btn-hover:rgba(37,53,94,.09);
    --shadow:14px 22px 48px rgba(43,58,105,.13),0 2px 6px rgba(43,58,105,.07);
    --shadow-hi:20px 32px 66px rgba(43,58,105,.2),0 4px 12px rgba(43,58,105,.1);
    --chip-shadow:0 8px 24px rgba(43,58,105,.08);
    --accent:#2f5cd9;
    --red:#e23b4e;--orange:#ef7715;--amber:#e0a410;
    --up:#d92b40;--up-bg:rgba(217,43,64,.09);--down:#0e9f61;--down-bg:rgba(14,159,97,.09);
    --h1-grad:linear-gradient(115deg,#1c2946 18%,#2f5cd9 62%,#7a3ff0);
    --tag-ink:#fff;--sel-bg:rgba(47,92,217,.22);
    --ring:rgba(47,92,217,.14);--ring-line:rgba(47,92,217,.6);
    --sb:rgba(23,32,61,.16);--sb-hi:rgba(23,32,61,.32);--sb-line:rgba(23,32,61,.16);--sb-line-hi:rgba(23,32,61,.3);
    --div-line:rgba(23,32,61,.13);
    --err-fg:#b32638;--err-bg:rgba(217,43,64,.06);--err-line:rgba(217,43,64,.3);
    --r1a:#ef4444;--r1b:#c81e30;--r2a:#f97316;--r2b:#d24a05;--r3a:#e3a008;--r3b:#9a6700;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-flip:cubic-bezier(.61,.98,.48,1.01);
    --dur-base:.32s;
  }
  /* ===== Aurora-Night（深色覆盖）===== */
  html[data-theme="dark"]{
    --cs:dark;
    --bg:#070b16;
    --aurora:
      radial-gradient(46% 38% at 12% 0%, rgba(70,105,255,.22), transparent 65%),
      radial-gradient(38% 32% at 88% 8%, rgba(146,80,235,.17), transparent 65%),
      radial-gradient(44% 38% at 55% 102%, rgba(20,190,210,.11), transparent 65%);
    --grid:rgba(255,255,255,.03);
    --ink:#e9edf8;--muted:#8e9ab5;--faint:#66718c;
    --hair:rgba(255,255,255,.10);--hair-soft:rgba(255,255,255,.05);--hair-hi:rgba(255,255,255,.24);
    --chip-bg:rgba(255,255,255,.05);--chip-bg2:rgba(255,255,255,.06);
    --glass:linear-gradient(165deg,rgba(168,184,235,.10),rgba(126,146,206,.045) 55%,rgba(255,255,255,.02));
    --panel-bg:rgba(14,19,35,.92);
    --row-hover:rgba(255,255,255,.06);--btn-hover:rgba(255,255,255,.08);
    --shadow:14px 20px 55px rgba(2,6,18,.42);
    --shadow-hi:18px 28px 72px rgba(2,6,18,.6);
    --chip-shadow:0 8px 24px rgba(2,6,18,.35);
    --accent:#6ea0ff;
    --red:#ff5d6c;--orange:#ff9f43;--amber:#ffd23e;
    --up:#ff7b8a;--up-bg:rgba(255,93,108,.12);--down:#3ddc9a;--down-bg:rgba(61,220,154,.10);
    --h1-grad:linear-gradient(115deg,#fff 20%,#9db9ff 62%,#cba6ff);
    --tag-ink:#0b101f;--sel-bg:rgba(110,160,255,.32);
    --ring:rgba(110,160,255,.15);--ring-line:rgba(110,160,255,.65);
    --sb:rgba(255,255,255,.14);--sb-hi:rgba(255,255,255,.26);--sb-line:rgba(255,255,255,.12);--sb-line-hi:rgba(255,255,255,.24);
    --div-line:rgba(255,255,255,.14);
    --err-fg:#ffb4bc;--err-bg:rgba(255,93,108,.08);--err-line:rgba(255,93,108,.3);
    --r1a:#ff7a5c;--r1b:#ff5d6c;--r2a:#ffc06a;--r2b:#ff9f43;--r3a:#ffe27a;--r3b:#ffd23e;
  }
  html{color-scheme:var(--cs);scrollbar-width:thin;scrollbar-color:var(--sb) transparent;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:clip;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;padding:28px 24px 48px;
  }
  /* 极光光斑（静态，低透明度） */
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:var(--aurora);}
  /* 细网格（延续原网格基因） */
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(85% 70% at 50% 0%, #000 55%, transparent 100%);
    mask-image:radial-gradient(85% 70% at 50% 0%, #000 55%, transparent 100%);
  }
  ::selection{background:var(--sel-bg);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:9999px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-hi);background-clip:content-box;}
  /* ===== 主题切换按钮（太阳/月亮）===== */
  .theme-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 auto;
    background:var(--chip-bg);border:1px solid var(--hair);box-shadow:var(--chip-shadow);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    transition:transform .3s var(--ease-flip),border-color .2s,color .2s;}
  .theme-btn:hover{color:var(--ink);border-color:var(--hair-hi);transform:rotate(-18deg) scale(1.08);}
  .theme-btn:active{transform:scale(.9) rotate(8deg);}
  .theme-btn svg{width:17px;height:17px;}
  .ic-sun{display:none;}
  html[data-theme="dark"] .ic-sun{display:block;}
  html[data-theme="dark"] .ic-moon{display:none;}
  /* 键盘可达性：统一焦点环 */
  .btn-pill:focus-visible,.theme-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--ring-line);outline-offset:2px;}
  .wrap{max-width:1280px;margin:0 auto;}
  /* ===== 页头 ===== */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
  .masthead h1{font-size:27px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;
    background:var(--h1-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .masthead h1 .logo{width:40px;height:40px;border-radius:12px;flex:0 0 40px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:grid;place-items:center;box-shadow:0 8px 24px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.35);}
  .masthead h1 .logo svg{width:22px;height:22px;}
  .masthead .sub{color:var(--muted);font-size:13.5px;margin-top:7px;line-height:1.6;}
  .masthead .datetime{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .masthead .datetime #dateTxt{color:var(--ink);font-weight:600;}
  .masthead .datetime .dt-sep{color:var(--faint);}
  .masthead .datetime #clockTxt{color:var(--accent);font-weight:700;letter-spacing:.5px;}
  .pill,.search .s-box{background:var(--chip-bg);border:1px solid var(--hair);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--chip-shadow);}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;min-height:38px;padding:0 15px;font-size:12.5px;color:var(--muted);}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#1fbf71;box-shadow:0 0 0 3px rgba(31,191,113,.16);animation:livePulse 2.4s ease-in-out infinite;flex:0 0 auto;}
  html[data-theme="dark"] .pill .dot{background:#2dd37f;box-shadow:0 0 0 3px rgba(45,211,127,.18);}
  @keyframes livePulse{50%{box-shadow:0 0 0 7px rgba(31,191,113,.05)}}
  .mh-right{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(430px,100%);}
  /* 第一行：状态 + 管理 + 主题；第二行：搜索框拉满 */
  .mh-row1{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  #status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 右侧工具组：管理入口 + 主题切换（同一操作语言，收在尾部） */
  .mh-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .btn-pill{display:inline-flex;align-items:center;gap:7px;height:38px;border-radius:999px;padding:0 15px;font-size:13px;font-weight:600;
    color:var(--ink);text-decoration:none;cursor:pointer;
    background:var(--chip-bg);border:1px solid var(--hair);box-shadow:var(--chip-shadow);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    transition:transform .22s var(--ease-flip),border-color .2s,box-shadow .2s;}
  .btn-pill svg{width:15px;height:15px;color:var(--accent);}
  .btn-pill:hover{transform:translateY(-1.5px);border-color:var(--hair-hi);box-shadow:var(--shadow);}
  .btn-pill:active{transform:scale(.95);}
  /* ===== 搜索 ===== */
  .search{position:relative;}
  .search .s-box{display:flex;align-items:center;border-radius:999px;padding:0 8px 0 13px;height:38px;width:100%;gap:8px;transition:border-color var(--dur-base),box-shadow var(--dur-base);}
  .search .s-box:focus-within{border-color:var(--ring-line);box-shadow:0 0 0 3px var(--ring),var(--chip-shadow);}
  .search .s-box svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto;}
  .search input{border:none;outline:none;font-size:16px;width:100%;background:transparent;color:var(--ink);caret-color:var(--accent);} /* 16px 避免 iOS Safari 聚焦自动放大 */
  .search input::placeholder{color:var(--faint);font-size:13px;}
  .search .s-clear{border:none;background:var(--chip-bg2);color:var(--muted);width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;display:none;place-items:center;flex:0 0 auto;}
  .search .s-clear.show{display:grid;}
  .search .s-clear:hover{background:var(--btn-hover);color:var(--ink);}
  .search input[type="search"]::-webkit-search-cancel-button,
  .search input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;}
  .search input[type="search"]::-ms-clear{display:none;}
  .search-panel{position:absolute;top:calc(100% + 8px);right:0;width:min(480px,90vw);background:var(--panel-bg);border:1px solid var(--hair);border-radius:16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-hi);display:none;overflow:hidden;z-index:50;}
  .search-panel.show{display:block;animation:panelIn .22s var(--ease-out);}
  @keyframes panelIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
  .sr-head{padding:10px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--hair);background:var(--chip-bg2);}
  .sr-list{max-height:min(60vh,420px);overflow-y:auto;scrollbar-width:thin;}
  .sr-list::-webkit-scrollbar{width:8px;}
  .sr-list::-webkit-scrollbar-thumb{background:transparent;border-radius:9999px;}
  .sr-list:hover::-webkit-scrollbar-thumb{background:var(--sb-line);}
  .sr-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--hair-soft);font-size:13px;line-height:1.45;transition:background .15s;}
  .sr-item:first-child{border-top:none;}
  .sr-item:hover{background:var(--row-hover);}
  .sr-item a{color:var(--ink);text-decoration:none;min-width:0;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .sr-item a:hover{color:var(--accent);}
  .sr-tag{flex:0 0 auto;font-size:11px;color:var(--tag-ink);border-radius:6px;padding:2px 7px;white-space:nowrap;font-weight:700;}
  .sr-hot{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sr-empty{padding:22px;text-align:center;color:var(--faint);font-size:13px;}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--div-line) 18%,var(--div-line) 82%,transparent);margin:22px 0 6px;}

  /* ===== 分类 ===== */
  .group{margin-top:34px;}
  .group-head{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
  .group-head .tag{width:5px;height:20px;border-radius:3px;box-shadow:0 0 14px -2px currentColor;}
  .group-head h2{font-size:19px;font-weight:700;letter-spacing:.4px;}
  .group-head .count{font-size:11.5px;color:var(--muted);background:var(--chip-bg2);border:1px solid var(--hair);border-radius:999px;padding:3.5px 11px;font-weight:600;margin-left:auto;letter-spacing:.2px;}
  .group-head .gcollapse{width:26px;height:26px;}
  /* 分类折叠：collapsed 时隐藏整行卡片 */
  .group.collapsed .row{display:none;}
  .group.collapsed .group-head{margin-bottom:0;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;animation:rowIn .3s var(--ease-out);}
  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== 玻璃卡片（warthog-85）===== */
  .card{
    --c:var(--accent);
    position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;
    padding:16px 16px 12px;border-radius:18px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid var(--hair);
    box-shadow:var(--shadow);
    opacity:0;animation:cardRise .55s var(--ease-out) forwards;
    transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out);
  }
  .card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.19s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(n+6){animation-delay:.28s}
  @keyframes cardRise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  /* 顶部身份光线 */
  .card::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.75;}
  /* hover 时顶部泛起源色光晕 */
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:130px;pointer-events:none;opacity:0;transition:opacity .45s var(--ease-out);
    background:radial-gradient(72% 100% at 50% 0%, rgba(110,160,255,.12), transparent 72%);
    background:radial-gradient(72% 100% at 50% 0%, color-mix(in srgb, var(--c) 20%, transparent), transparent 72%);}
  .card:hover::after{opacity:1;}
  .card:hover{transform:translateY(-4px) scale(1.012);border-color:var(--hair-hi);box-shadow:var(--shadow-hi);}
  @supports (color:color-mix(in srgb, #fff, #000)){
    .card:hover{box-shadow:var(--shadow-hi),0 24px 64px -20px color-mix(in srgb, var(--c) 45%, transparent),0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);}
  }
  .card:active{transform:scale(.985) rotate(.35deg);}
  @media (prefers-reduced-motion: reduce){.card{animation:none;opacity:1;}.card:hover,.card:active{transform:none;}.pill .dot{animation:none;}.btn-pill:hover,.btn-pill:active,.theme-btn:hover,.theme-btn:active{transform:none;}}

  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;position:relative;z-index:1;}
  .card-top .src{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .card-top .src a{color:inherit;text-decoration:none;}
  .card-top .src a:hover{color:var(--c);}
  .card-top .acts{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  /* ===== 图标按钮 ===== */
  .icon-btn{display:grid;place-items:center;border:none;background:transparent;color:var(--faint);cursor:pointer;border-radius:8px;transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--btn-hover);color:var(--ink);}
  .icon-btn svg{width:14px;height:14px;}
  .card-top .expand{width:24px;height:24px;}
  .group-head .gcollapse{width:26px;height:26px;}
  /* 展开按钮：owl-60 3D 翻转（正面 v，背面 ∧，hover / 已展开时翻转） */
  .expand{perspective:300px;}
  .expand .chev{display:inline-flex;transform-style:preserve-3d;transition:transform .55s var(--ease-flip);}
  .card.expanded .expand .chev{transform:rotateX(180deg);}
  @media (hover:hover) and (pointer:fine){.card:hover .expand .chev{transform:rotateX(180deg);}}
  /* 分类折叠按钮：朝上=可收起，折叠后朝下=可展开 */
  .gcollapse .chev{display:inline-flex;transform:rotate(180deg);transition:transform .45s var(--ease-flip);}
  .group.collapsed .gcollapse .chev{transform:rotate(0);}
  /* 源图标：小玻璃芯片，hover 卡片时 3D 翻面（owl 同款缓动） */
  .card-top .ico{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--c);
    background:var(--chip-bg);border:1px solid var(--hair);
    background:color-mix(in srgb, var(--c) 14%, transparent);
    border-color:color-mix(in srgb, var(--c) 34%, transparent);
    font-weight:700;}
  .ico .chipin{display:grid;place-items:center;font-size:11px;transform-style:preserve-3d;transition:transform .6s var(--ease-flip);}
  .ico .chipin svg{width:15px;height:15px;display:block;}
  .ico .chipin .ch{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;line-height:1;letter-spacing:.2px;font-family:var(--font-display);}
  .ico .chipin .ch-img{width:18px;height:18px;border-radius:6px;object-fit:contain;display:block;background:rgba(127,127,127,.08);padding:2px;}
  .card:hover .ico .chipin{transform:rotateY(180deg) rotateZ(10deg);}
  .card .ts{font-size:11px;color:var(--faint);margin-bottom:8px;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
  .card .ts .err{color:var(--up);}
  .card .list{list-style:none;display:flex;flex-direction:column;flex:1;position:relative;z-index:1;}
  .card .item{display:flex;align-items:flex-start;gap:9px;padding:6px 7px;margin:1px -7px;border-radius:8px;border-top:1px solid var(--hair-soft);font-size:13.5px;line-height:1.5;transition:background var(--dur-base) ease;}
  .card .item:hover{background:var(--row-hover);}
  .card .item:first-child{border-top:none;}
  /* ===== 展开长列表：newt-49 细滚动条（hover 才浮现）===== */
  .card.expanded .list{max-height:min(60vh,460px);overflow-y:auto;padding-right:8px;margin-right:-8px;scrollbar-width:thin;scrollbar-color:transparent transparent;}
  .card.expanded:hover .list{scrollbar-color:var(--sb-line) transparent;}

<script>
/* ===== 配置：数据源直连抓取，会话缓存，自动刷新 ===== */
const rankCls = (i) => i===0?'r1':i===1?'r2':i===2?'r3':'r4';
const API_CODELIFE = 'https://api.codelife.cc/api/top/list';
const CACHE_PREFIX = 'hb:';
const CACHE_TTL = 0; // 0 表示以 refreshSeconds 为准

let CONFIG = { refreshSeconds: 600, groups: [] };
let timers = [];
const BOARD_DATA = {}; // id -> {src, items}，供搜索使用
function storeData(src, items){ if (items && items.length) BOARD_DATA[src.id] = { src, items }; }

function flameIcon(){return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4.5 4 8.5a4 4 0 0 1-8 0C8 6.5 12 2 12 2z"/><path d="M12 22c4 0 6.5-2.5 6.5-6 0-2-1-4-2.5-5.5-.3 1.5-1 3-2 4 0-2.5-.8-5-2.6-7C10.4 9 9 11.6 9 13.6c0 2.5-1.6 3.4-1.6 3.4S6 16 6 16.6C6 20 8 22 12 22z"/></svg>';}
function quoteIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5l5.5-6 4 3.5 6.5-8.5"/><path d="M15 6.5h4.5V11"/></svg>';}
/* 平台标识：优先显示平台图标（icons/），无图标或加载失败回退品牌色首字；行情卡保持折线图标 */
function chipIcon(c, g){
  if (c.type === 'quote') return quoteIcon();
  const col = c.iconColor || g.color || '#2563eb';
  let fg = '#ffffff', lum = 0.5;
  try {
    const n = parseInt(col.replace('#',''), 16);
    const r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
    lum = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
  } catch(e){}
  if (lum >= 0.55) fg = '#16203a';
  if (c.icon) {
    const name = escapeHtml((c.name || '').trim());
    return '<img class="ch-img" src="' + escapeHtml(c.icon) + '" alt="' + name + '" loading="lazy" decoding="async" onerror="imgFallback(this,\'' + name.replace(/'/g,'') + '\',\'' + col + '\',\'' + fg + '\')">';
  }
  return '<b class="ch" style="background:' + col + ';color:' + fg + '">' + escapeHtml((c.name || '?').trim()[0] || '?') + '</b>';
}
/* 图标加载失败：回退为首字色块 */
function imgFallback(img, name, col, fg){
  const b = document.createElement('b');
  b.className = 'ch';
  b.style.background = col;
  b.style.color = fg;
  b.textContent = (name || '?').trim()[0] || '?';
  if (img && img.parentNode) img.parentNode.replaceChild(b, img);
}

/* 会话缓存：先展示旧数据，后台刷新后覆盖 */
function cacheGet(key){
  try {
    const raw = sessionStorage.getItem(CACHE_PREFIX + key);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function cacheSet(key, val){
  try { sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify(val)); } catch(e){}
}

/* 构造请求 URL：codelife 加 timestamp 绕过 CDN 缓存；其他接口原样 */
function buildUrl(src){
  let url = src.url || '';
  if (!url) return '';
  if (url.includes('api.codelife.cc')) {
    url += (url.includes('?') ? '&' : '?') + 'timestamp=' + Date.now();
  }
  return url;
}

/* 通用解析：支持 codelife {code,data:[{title,hotValue,link}]} 与自定义字段映射 */
function parseItems(src, data){
  let arr = data;
  if (src.listPath) {
    arr = src.listPath.split('.').reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : null, data);
  } else if (Array.isArray(data)) {
    arr = data;
  } else if (data && Array.isArray(data.data)) {
    arr = data.data;
  }
  if (!Array.isArray(arr)) {
    if (arr && typeof arr === 'object') arr = [arr];   // 单对象接口（每日一句/随机数据）当 1 条渲染
    else arr = [];
  }
  // 字段取值：支持嵌套路径（如 origin.title）
  const fv = (it, field) => {
    if (field == null || field === '') return undefined;
    return String(field).split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : undefined, it);
  };
  const f0 = (src.fields && src.fields[0]) ? src.fields[0].field : null;
  const titleField = f0 || src.titleField || 'title';
  const urlField = src.urlField || 'url';
  const exFields = (src.fields || []).slice(1);
  return arr.map((it, idx) => {
    const extra = exFields.map(f => ({
      label: f.label || '',
      value: fv(it, f.field)
    })).filter(e => e.value !== '');
    return {
      rank: it.index || (idx + 1),
      title: fv(it, titleField) !== undefined ? fv(it, titleField) : (it.title || it.name || ''),
      url: fv(it, urlField) !== undefined ? fv(it, urlField) : (it.link || it.url || ''),
      hot: it.hotValue !== undefined ? it.hotValue : (it.hot || it.num || ''),
      extra: extra.length ? extra : undefined
    };
  }).filter(t => t.title);
}

/* 腾讯行情解析：返回 v_code="字段~或," 行；指数 ~ 分隔、外盘 , 分隔；GBK 已由调用方解码 */
function parseQuoteResponse(text, src){
  const out = [];
  const seg = text.split(';');
  for (const line of seg) {
    const m = line.match(/v_([^=]+)="([^"]*)"/);
    if (!m) continue;
    const code = m[1], raw = m[2];
    if (!raw) continue;
    let f, name, price, prev, change, pct;
    if (raw.includes('~')) {
      f = raw.split('~');
      name = f[1] || '';
      price = parseFloat(f[3]);
      prev = parseFloat(f[4]);
      change = parseFloat(f[31]);
      pct = parseFloat(f[32]);
    } else {
      f = raw.split(',');
      name = f[13] || '';
      price = parseFloat(f[0]);
      prev = parseFloat(f[7]);
      change = price - prev;
      pct = parseFloat(f[1]);
    }
    if (!name || isNaN(price)) continue;
    const idx = (src.symbols || []).indexOf(code);
    const title = (src.names && src.names[idx]) || name;
    out.push({ rank: idx + 1, title, price, change, pct, url: 'https://gu.qq.com/' + code });
  }
  return out;
}

function fmtQuote(n){
  if (isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 100000) return (n/10000).toFixed(1) + '万';
  return n.toFixed(2);
}

/* Frankfurter 汇率解析：7 日序列 {date:{CUR:rate}}；交叉换算「1 外币 = ? 人民币」，涨跌 = 最近交易日环比 */
function parseFx(data, src){
  const rs = data && data.rates;
  if (!rs) return [];
  const dates = Object.keys(rs).sort();
  if (dates.length < 2) return [];
  const last = rs[dates[dates.length - 1]];
  const prev = rs[dates[dates.length - 2]];
  const cnyLast = parseFloat(last.CNY), cnyPrev = parseFloat(prev.CNY);
  if (!cnyLast || !cnyPrev) return [];
  const out = [];
  for (let i = 0; i < (src.symbols || []).length; i++) {
    const code = src.symbols[i];
    let cur, old;
    if (code === 'USD') { cur = cnyLast; old = cnyPrev; }
    else {
      const rLast = parseFloat(last[code]), rPrev = parseFloat(prev[code]);
      if (!rLast || !rPrev) continue;
      cur = cnyLast / rLast;
      old = cnyPrev / rPrev;
    }
    out.push({ rank: i + 1, title: src.names[i], price: cur, pct: (cur - old) / old * 100, url: '' });
  }
  return out;
}

/* 抓取单个数据源：先回缓存渲染，再后台刷新 */
async function loadSource(src, el){
  const key = src.id;
  const cached = cacheGet(key);
  const now = Date.now();
  const staleMs = (CONFIG.refreshSeconds || 600) * 1000;

  // 缓存未过期：直接渲染缓存，不重复请求
  if (cached && cached.t && (now - cached.t) < staleMs) {
    storeData(src, cached.items);
    renderCard(el, src, cached.items, cached.t, null);
    return;
  }

  // 有缓存但过期：先展示旧数据（标注抓取时间），再后台刷新
  if (cached && cached.items) {
    storeData(src, cached.items);
    renderCard(el, src, cached.items, cached.t, null);
  } else {
    el.querySelector('.list').innerHTML = '<div class="loading">加载中…</div>';
  }

  try {
    const opt = { signal: AbortSignal.timeout(15000) };
    if (src.headers) {
      try { opt.headers = JSON.parse(src.headers); } catch(e){}
    }

    let items;
    if (src.type === 'page') {
      // 服务端代理源：后端抓取无 CORS 页面/接口并解析（同源 /api/proxy）
      const pr = await fetch('/api/proxy?id=' + encodeURIComponent(src.id), opt);
      const pj = await pr.json();
      items = parseItems(src, pj);
    } else {
      const url = buildUrl(src);
      if (!url) throw new Error('接口 URL 为空');
      const res = await fetch(url, opt);
      if (!res.ok) throw new Error('HTTP ' + res.status);

      if (src.type === 'quote') {
        // 行情接口：GBK 编码，需解码后按腾讯格式解析
        const buf = await res.arrayBuffer();
        const text = new TextDecoder('gbk').decode(buf);
        items = parseQuoteResponse(text, src);
      } else if (src.type === 'fx') {
        // 汇率接口：frankfurter 7 日序列（ECB 中间价，基准 USD），最近交易日环比算涨跌
        const d = new Date();
        d.setDate(d.getDate() - 7);
        const sd = d.toISOString().slice(0, 10);
        const to = 'CNY,' + (src.symbols || []).filter(c => c !== 'USD').join(',');
        const ser = await fetch('https://api.frankfurter.dev/v1/' + sd + '..?from=USD&to=' + to, opt);
        const sj = await ser.json();
        items = parseFx(sj, src);
      } else {
        const json = await res.json();
        items = parseItems(src, json);
      }
    }
    if (!items.length) throw new Error('解析结果为空');
    const entry = { t: Date.now(), items };
    cacheSet(key, entry);
    storeData(src, items);
    renderCard(el, src, items, entry.t, null);
  } catch (e) {
    // 刷新失败：保留旧数据并标注
    if (cached && cached.items) {
      renderCard(el, src, cached.items, cached.t, '刷新失败，展示 ' + (CONFIG.refreshSeconds/60) + ' 分钟前数据');
    } else {
      renderCard(el, src, [], 0, '加载失败：' + e.message);
    }
  }
}

function renderCard(el, src, items, t, err){
  const show = src.showItems || 6;
  const list = el.querySelector('.list');
  const tsEl = el.querySelector('.ts');
  const btn = el.querySelector('.expand');
  const expanded = el.classList.contains('expanded');
  if (btn) {
    btn.title = expanded ? '收起' : '展开全部';
    btn.style.display = (items && items.length > show) ? '' : 'none';
  }
  if (err) {
    tsEl.innerHTML = '<span class="err">' + escapeHtml(err) + '</span>';
  } else if (t) {
    const d = new Date(t);
    tsEl.textContent = '抓取于 ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  } else {
    tsEl.textContent = '';
  }
  if (!items || !items.length) {
    list.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  // 行情卡片：名称 + 点位 + 涨跌（红涨绿跌）
  if (src.type === 'quote') {
    list.innerHTML = items.map(t2=>{
      const up = t2.change >= 0;
      return `
    <li class="item q">
      <a href="${safeUrl(t2.url)}" target="_blank" rel="noopener" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</a>
      <span class="q-num">${fmtQuote(t2.price)}</span>
      <span class="q-chg ${up?'up':'down'}">${up?'+':''}${fmtQuote(t2.change)} ${t2.pct>=0?'+':''}${(!isNaN(t2.pct)?t2.pct.toFixed(2):'—')}%</span>
    </li>`;}).join('');
    const more = el.querySelector('.more');
    if (more) more.textContent = src.note || ('TOP ' + items.length + ' · 实时行情');
    return;
  }
  // 汇率卡片：货币对 + 交叉汇率（4 位小数）+ 涨跌%
  if (src.type === 'fx') {
    list.innerHTML = items.map(t2=>{
      const up = (t2.pct || 0) >= 0;
      return `
    <li class="item q">
      <span class="fx-name" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</span>
      <span class="q-num">${(!isNaN(t2.price)?t2.price.toFixed(4):'—')}</span>
      <span class="q-chg ${up?'up':'down'}">${up?'+':''}${(!isNaN(t2.pct)?t2.pct.toFixed(2):'—')}%</span>
    </li>`;}).join('');
    const more = el.querySelector('.more');
    if (more) more.textContent = src.note || ('TOP ' + items.length + ' · 实时汇率');
    return;
  }
  // 全部条目渲染，超出 showItems 的加 .x 类，由 .expanded 控制显隐
  list.innerHTML = items.map((t2,i)=>`
    <li class="item${i>=show?' x':''}">
      <span class="rank ${rankCls(i)}">${t2.rank||i+1}</span>
      <span class="ti">${t2.url ? `<a href="${safeUrl(t2.url)}" target="_blank" rel="noopener" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</a>` : `<b class="tt">${escapeHtml(t2.title)}</b>`}${t2.extra ? `<span class="ex">${t2.extra.map(e=>escapeHtml(e.label?e.label+' '+e.value:e.value)).join(' · ')}</span>` : ''}</span>
      ${t2.hot ? `<span class="hot">${escapeHtml(String(t2.hot))}</span>` : ''}
    </li>`).join('');
  const more = el.querySelector('.more');
  if (more) {
    if (items.length > show) {
      more.textContent = expanded ? ('已展开 · 共 ' + items.length + ' 条') : ('TOP ' + show + ' · 共 ' + items.length + ' 条');
    } else {
      more.textContent = 'TOP ' + Math.min(show, items.length);
    }
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u){
  try {
    const x = new URL(u, location.origin);
    if (!/^https?:$/.test(x.protocol)) return '#';
    return x.href;
  } catch(e){ return '#'; }
}

async function loadBoard(){
  const app = document.getElementById('app');
  const status = document.getElementById('status');
  try {
    const res = await fetch('/api/board');
    if (!res.ok) throw new Error('API ' + res.status);
    const board = await res.json();
    CONFIG = { refreshSeconds: board.refreshSeconds || 600, cardsPerRow: board.cardsPerRow || 4, groups: board.groups || [] };
    status.textContent = '已连接 · 每 ' + (CONFIG.refreshSeconds/60) + ' 分钟自动刷新';
    if (!CONFIG.groups.length) {
      app.innerHTML = '<div class="error-row">暂无任何分类，请先到后台「管理」添加分类和数据源。</div>';
      return;
    }
    // 清理旧定时器
    timers.forEach(t=>clearInterval(t)); timers = [];
    // 渲染骨架
    const html = CONFIG.groups.map(g=>{
      const cols = Math.min(Math.max(CONFIG.cardsPerRow || 4, 2), 6);
      const cards = g.cards || [];
      return `
        <section class="group">
          <div class="group-head"><span class="tag" style="background:${g.color};color:${g.color}"></span><h2>${escapeHtml(g.name)}</h2><span class="count">${cards.length} 个数据源</span><button class="gcollapse icon-btn" type="button" title="折叠分类" aria-label="折叠或展开分类"><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button></div>
          <div class="row" style="grid-template-columns:repeat(${cols},1fr)">${cards.map(c=>`
            <article class="card" data-src="${c.id}" data-show-items="${c.showItems||6}" style="--c:${c.iconColor||g.color}">
              <div class="card-top">
                <span class="src">${escapeHtml(c.name)}</span>
                <span class="acts">
                  <button class="expand icon-btn" type="button" title="展开全部" aria-label="展开或收起"><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button>
                  <span class="ico"><span class="chipin">${chipIcon(c, g)}</span></span>
                </span>
              </div>
              <div class="ts"></div>
              <ul class="list"><div class="loading">加载中…</div></ul>
              <div class="more"></div>
            </article>`).join('')}
          </div>
        </section>`;
    }).join('');
    app.innerHTML = html;

    // 立即并行抓取全部数据源（hotboard 模式：浏览器直连）
    const cards = app.querySelectorAll('.card');
    const sources = [];
    CONFIG.groups.forEach(g => (g.cards||[]).forEach(c => sources.push(c)));
    const map = {};
    sources.forEach(s => map[s.id] = s);
    cards.forEach(card => {
      const src = map[card.dataset.src];
      if (src) loadSource(src, card);
    });

    // 自动刷新：每 refreshSeconds 轮询一次，只刷过期缓存
    const timer = setInterval(() => {
      CONFIG.groups.forEach(g => (g.cards||[]).forEach(s => {
        const el = document.querySelector(`.card[data-src="${s.id}"]`);
        if (el) loadSource(s, el);
      }));
    }, CONFIG.refreshSeconds * 1000);
    timers.push(timer);
  } catch (e) {
    status.textContent = '连接失败';
    app.innerHTML = '<div class="error-row">加载失败：' + escapeHtml(e.message) + '（请确认已部署边缘函数并绑定 KV）</div>';
  }
}

// toast 提示 + 卡片展开/收起 + 分类折叠（事件委托）
(function(){
  const t=document.createElement('div');t.className='toast';document.body.appendChild(t);
  let timer;
  function show(msg){t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800);}
  document.addEventListener('click',e=>{
    // 分类整体折叠
    const gb = e.target.closest('.gcollapse');
    if (gb) {
      const group = gb.closest('.group');
      if (!group) return;
      group.classList.toggle('collapsed');
      gb.title = group.classList.contains('collapsed') ? '展开分类' : '折叠分类';
      return;
    }
    const btn = e.target.closest('.expand');
    if (btn) {
      const card = btn.closest('.card');
      if (!card) return;
      card.classList.toggle('expanded');
      const exp = card.classList.contains('expanded');
      btn.title = exp ? '收起' : '展开全部';
      const more = card.querySelector('.more');
      const n = card.querySelectorAll('.item').length;
      const showN = parseInt((card.dataset.showItems || '6'), 10);
      if (more) more.textContent = exp ? ('已展开 · 共 ' + n + ' 条') : ('TOP ' + Math.min(showN, n) + ' · 共 ' + n + ' 条');
      return;
    }
    const a=e.target.closest('a');
    if(a && (!a.href || a.href==='#')) { e.preventDefault(); show('该条目暂无跳转链接'); }
  });
})();

/* ===== 新闻搜索 ===== */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchPanel = document.getElementById('searchPanel');
let searchTimer = null;

function closeSearch(){
  searchPanel.classList.remove('show');
  searchPanel.innerHTML = '';
}
function runSearch(){
  const q = (searchInput.value || '').trim().toLowerCase();
  if (!q) { searchClear.classList.remove('show'); closeSearch(); return; }
  searchClear.classList.add('show');
  const results = [];
  for (const id in BOARD_DATA) {
    const d = BOARD_DATA[id];
    for (const it of d.items) {
      const title = String(it.title || '');
      if (title.toLowerCase().includes(q)) results.push({ src: d.src, it });
    }
  }
  if (!results.length) {
    searchPanel.innerHTML = '<div class="sr-empty">未找到包含「' + escapeHtml(q) + '」的新闻</div>';
  } else {
    const top = results.slice(0, 120);
    searchPanel.innerHTML = '<div class="sr-head">在 ' + Object.keys(BOARD_DATA).length + ' 个数据源中找到 ' + results.length + ' 条相关新闻' + (results.length > top.length ? '（显示前 ' + top.length + ' 条）' : '') + '</div><div class="sr-list">' + top.map(r => `
      <div class="sr-item">
        <span class="sr-tag" style="background:${r.src.iconColor||'#2563eb'}">${escapeHtml(r.src.name)}</span>
        <a href="${safeUrl(r.it.url)}" target="_blank" rel="noopener" title="${escapeHtml(r.it.title)}">${escapeHtml(r.it.title)}</a>
        ${r.it.hot ? `<span class="sr-hot">${escapeHtml(String(r.it.hot))}</span>` : ''}
      </div>`).join('') + '</div>';
  }
  searchPanel.classList.add('show');
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 200);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(); }
  if (e.key === 'Escape') { searchInput.value = ''; closeSearch(); searchClear.classList.remove('show'); }
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  closeSearch();
  searchClear.classList.remove('show');
  searchInput.focus();
});
// 点击搜索框外部关闭结果面板
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) closeSearch();
});

/* ===== 主题切换（默认浅色；localStorage 记忆，与后台共享） ===== */
(function(){
  const btn=document.getElementById('themeBtn');
  btn.addEventListener('click',()=>{
    const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('board_theme',next)}catch(e){}
    if(btn.animate){btn.animate([{transform:'rotate(0) scale(.75)'},{transform:'rotate(200deg) scale(1)'}],{duration:380,easing:'cubic-bezier(.61,.98,.48,1.01)'});}
  });
})();

/* ===== 回到顶部悬浮按钮 ===== */
(function(){
  const btn = document.getElementById('toTop');
  if (!btn) return;
  const onScroll = () => {
    btn.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop) > 480);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

/* ===== 顶部日期时间（实时时钟，每秒更新） ===== */
(function(){
  const WEEK = ['日','一','二','三','四','五','六'];
  function tick(){
    const d = new Date();
    document.getElementById('dateTxt').textContent =
      d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日 星期' + WEEK[d.getDay()];
    document.getElementById('clockTxt').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
})();

loadBoard();
