<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>热点聚合看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 18l5-7 4 5 5-7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f2f4f8;--card:#fff;--ink:#1c2333;--muted:#7b8496;--line:#e5e9f0;
    --accent:#2563eb;--red:#ef4444;--orange:#f97316;--amber:#eab308;--gray:#9aa3b2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 18% 6%, rgba(37,99,235,.08), transparent 38%),
      radial-gradient(circle at 86% 12%, rgba(16,185,129,.07), transparent 34%),
      linear-gradient(#e7ebf2 1px, transparent 1px),
      linear-gradient(90deg, #e7ebf2 1px, transparent 1px);
    background-size:auto,auto,26px 26px,26px 26px;
    color:var(--ink);min-height:100vh;padding:28px 24px 48px;
  }
  .wrap{max-width:1280px;margin:0 auto;}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
  .masthead h1{font-size:26px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;}
  .masthead h1 .logo{width:38px;height:38px;border-radius:11px;flex:0 0 38px;background:linear-gradient(135deg,#2563eb,#4f46e5);display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,99,235,.28);}
  .masthead h1 .logo svg{width:22px;height:22px;}
  .masthead .sub{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.6;}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted);box-shadow:0 1px 3px rgba(16,24,40,.05);}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .admin-link{margin-left:8px;font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;}
  .admin-link:hover{text-decoration:underline;}
  .divider{height:1px;background:var(--line);margin:22px 0 6px;}

  .group{margin-top:34px;}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .group-head .tag{width:5px;height:20px;border-radius:3px;}
  .group-head h2{font-size:19px;font-weight:700;}
  .group-head .count{font-size:12.5px;color:var(--muted);margin-left:auto;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.04);display:flex;flex-direction:column;min-width:0;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
  .card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.09);border-color:#d8e0ee;}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .card-top .src{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .card-top .src a{color:inherit;text-decoration:none;}
  .card-top .src a:hover{color:var(--accent);}
  .card-top .acts{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
  .card-top .expand{border:none;background:transparent;color:#9aa3b2;cursor:pointer;font-size:12px;line-height:1;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;transition:background .15s,color .15s;}
  .card-top .expand:hover{background:#eef2f8;color:var(--ink);}
  .card-top .ico{flex:0 0 auto;}
  .card-top .ico svg{width:16px;height:16px;display:block;}
  .card .ts{font-size:11px;color:#b4bcc9;margin-bottom:8px;}
  .card .ts .err{color:#dc2626;}
  .card .list{list-style:none;display:flex;flex-direction:column;flex:1;}
  .card .item{display:flex;align-items:flex-start;gap:9px;padding:5.5px 0;border-top:1px solid #f0f2f7;font-size:13.5px;line-height:1.5;}
  .card .item:first-child{border-top:none;}
  /* 折叠：超出 showItems 的条目默认隐藏，卡片 expanded 时显示 */
  .card .item.x{display:none;}
  .card.expanded .item.x{display:flex;}
  .card .item a{color:var(--ink);text-decoration:none;min-width:0;flex:1;}
  .card .item a:hover{color:var(--accent);}
  .rank{flex:0 0 17px;width:17px;height:17px;border-radius:4.5px;font-size:11px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:2px;}
  .r1{background:var(--red);}.r2{background:var(--orange);}.r3{background:var(--amber);}.r4{background:var(--gray);}
  .item .hot{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--muted);padding-left:6px;white-space:nowrap;}
  .card .empty{color:#b4bcc9;font-size:13px;padding:16px 0;text-align:center;flex:1;}
  .card .loading{color:#b4bcc9;font-size:13px;padding:16px 0;text-align:center;flex:1;}
  .card .more{text-align:right;font-size:11.5px;color:#b4bcc9;margin-top:10px;}
  .loading-row{color:#777;padding:24px;font-size:14px;}
  .error-row{color:#dc2626;padding:16px;font-size:13.5px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;}
  .foot{text-align:center;color:#a6aebb;font-size:12px;margin-top:44px;line-height:1.7;}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#1c2333;color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.22);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:99;max-width:80vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:1279px){
    /* 桌面以下自动降列：卡片换行排列，不再横向挤压滚动 */
    .row{grid-template-columns:repeat(auto-fit,minmax(250px,1fr)) !important;}
  }
  @media (max-width:640px){
    body{padding:20px 14px 40px;}
    .masthead h1{font-size:22px;}
    /* 手机端单列竖排：每张卡片完整可读 */
    .row{grid-template-columns:repeat(1,1fr) !important;}
    .card{padding:15px 15px 12px;}
    .card .item{font-size:13.5px;padding:6.5px 0;}
    .card .hot{max-width:38%;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>
        <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17l6-8 5 6 5-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        热点聚合看板
      </h1>
      <div class="sub">全网热搜 · 体育赛事 · 影视动态 · 每日资讯 一站式预览</div>
    </div>
    <div class="pill"><span class="dot"></span><span id="status">加载中…</span><a class="admin-link" href="/admin.html">管理</a></div>
  </header>
  <div class="divider"></div>
  <div id="app"><div class="loading-row">正在加载看板数据…</div></div>
  <div class="foot">热点聚合看板 · 浏览器直连数据源 · 会话缓存 · 自动刷新（参考 hotboard 架构）</div>
</div>

<script>
/* ===== 配置：数据源直连抓取，会话缓存，自动刷新 ===== */
const rankCls = (i) => i===0?'r1':i===1?'r2':i===2?'r3':'r4';
const API_CODELIFE = 'https://api.codelife.cc/api/top/list';
const CACHE_PREFIX = 'hb:';
const CACHE_TTL = 0; // 0 表示以 refreshSeconds 为准

let CONFIG = { refreshSeconds: 600, groups: [] };
let timers = [];

function flameIcon(){return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4.5 4 8.5a4 4 0 0 1-8 0C8 6.5 12 2 12 2z"/><path d="M12 22c4 0 6.5-2.5 6.5-6 0-2-1-4-2.5-5.5-.3 1.5-1 3-2 4 0-2.5-.8-5-2.6-7C10.4 9 9 11.6 9 13.6c0 2.5-1.6 3.4-1.6 3.4S6 16 6 16.6C6 20 8 22 12 22z"/></svg>';}

/* 会话缓存：先展示旧数据，后台刷新后覆盖 */
function cacheGet(key){
  try {
    const raw = sessionStorage.getItem(CACHE_PREFIX + key);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function cacheSet(key, val){
  try { sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify(val)); } catch(e){}
}

/* 构造请求 URL：codelife 加 timestamp 绕过 CDN 缓存；其他接口原样 */
function buildUrl(src){
  let url = src.url || '';
  if (!url) return '';
  if (url.includes('api.codelife.cc')) {
    url += (url.includes('?') ? '&' : '?') + 'timestamp=' + Date.now();
  }
  return url;
}

/* 通用解析：支持 codelife {code,data:[{title,hotValue,link}]} 与自定义字段映射 */
function parseItems(src, data){
  let arr = data;
  if (src.listPath) {
    arr = src.listPath.split('.').reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : null, data);
  } else if (Array.isArray(data)) {
    arr = data;
  } else if (data && Array.isArray(data.data)) {
    arr = data.data;
  }
  if (!Array.isArray(arr)) arr = [];
  const titleField = src.titleField || 'title';
  const urlField = src.urlField || 'url';
  return arr.map((it, idx) => ({
    rank: it.index || (idx + 1),
    title: it[titleField] !== undefined ? it[titleField] : (it.title || it.name || ''),
    url: it[urlField] !== undefined ? it[urlField] : (it.link || it.url || ''),
    hot: it.hotValue !== undefined ? it.hotValue : (it.hot || it.num || '')
  })).filter(t => t.title);
}

/* 抓取单个数据源：先回缓存渲染，再后台刷新 */
async function loadSource(src, el){
  const key = src.id;
  const cached = cacheGet(key);
  const now = Date.now();
  const staleMs = (CONFIG.refreshSeconds || 600) * 1000;

  // 缓存未过期：直接渲染缓存，不重复请求
  if (cached && cached.t && (now - cached.t) < staleMs) {
    renderCard(el, src, cached.items, cached.t, null);
    return;
  }

  // 有缓存但过期：先展示旧数据（标注抓取时间），再后台刷新
  if (cached && cached.items) {
    renderCard(el, src, cached.items, cached.t, null);
  } else {
    el.querySelector('.list').innerHTML = '<div class="loading">加载中…</div>';
  }

  try {
    const url = buildUrl(src);
    if (!url) throw new Error('接口 URL 为空');
    const opt = { signal: AbortSignal.timeout(15000) };
    if (src.headers) {
      try { opt.headers = JSON.parse(src.headers); } catch(e){}
    }
    const res = await fetch(url, opt);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const items = parseItems(src, json);
    if (!items.length) throw new Error('解析结果为空');
    const entry = { t: Date.now(), items };
    cacheSet(key, entry);
    renderCard(el, src, items, entry.t, null);
  } catch (e) {
    // 刷新失败：保留旧数据并标注
    if (cached && cached.items) {
      renderCard(el, src, cached.items, cached.t, '刷新失败，展示 ' + (CONFIG.refreshSeconds/60) + ' 分钟前数据');
    } else {
      renderCard(el, src, [], 0, '加载失败：' + e.message);
    }
  }
}

function renderCard(el, src, items, t, err){
  const show = src.showItems || 6;
  const list = el.querySelector('.list');
  const tsEl = el.querySelector('.ts');
  const btn = el.querySelector('.expand');
  const expanded = el.classList.contains('expanded');
  if (btn) {
    btn.textContent = expanded ? '▴' : '▾';
    btn.title = expanded ? '收起' : '展开全部';
    btn.style.display = (items && items.length > show) ? '' : 'none';
  }
  if (err) {
    tsEl.innerHTML = '<span class="err">' + escapeHtml(err) + '</span>';
  } else if (t) {
    const d = new Date(t);
    tsEl.textContent = '抓取于 ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  } else {
    tsEl.textContent = '';
  }
  if (!items || !items.length) {
    list.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  // 全部条目渲染，超出 showItems 的加 .x 类，由 .expanded 控制显隐
  list.innerHTML = items.map((t2,i)=>`
    <li class="item${i>=show?' x':''}">
      <span class="rank ${rankCls(i)}">${t2.rank||i+1}</span>
      <a href="${safeUrl(t2.url)}" target="_blank" rel="noopener" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</a>
      ${t2.hot ? `<span class="hot">${escapeHtml(String(t2.hot))}</span>` : ''}
    </li>`).join('');
  const more = el.querySelector('.more');
  if (more) {
    if (items.length > show) {
      more.textContent = expanded ? ('已展开 · 共 ' + items.length + ' 条') : ('TOP ' + show + ' · 共 ' + items.length + ' 条');
    } else {
      more.textContent = 'TOP ' + Math.min(show, items.length);
    }
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u){
  try {
    const x = new URL(u, location.origin);
    if (!/^https?:$/.test(x.protocol)) return '#';
    return x.href;
  } catch(e){ return '#'; }
}

async function loadBoard(){
  const app = document.getElementById('app');
  const status = document.getElementById('status');
  try {
    const res = await fetch('/api/board');
    if (!res.ok) throw new Error('API ' + res.status);
    const board = await res.json();
    CONFIG = { refreshSeconds: board.refreshSeconds || 600, groups: board.groups || [] };
    status.textContent = '已连接 · 每 ' + (CONFIG.refreshSeconds/60) + ' 分钟自动刷新';
    if (!CONFIG.groups.length) {
      app.innerHTML = '<div class="error-row">暂无任何分类，请先到后台「管理」添加分类和数据源。</div>';
      return;
    }
    // 清理旧定时器
    timers.forEach(t=>clearInterval(t)); timers = [];
    // 渲染骨架
    const html = CONFIG.groups.map(g=>{
      const cols = Math.min(Math.max(g.cardCount||5,1),5);
      const cards = g.cards || [];
      return `
        <section class="group">
          <div class="group-head"><span class="tag" style="background:${g.color}"></span><h2>${escapeHtml(g.name)}</h2><span class="count">${cards.length} 个数据源</span></div>
          <div class="row" style="grid-template-columns:repeat(${cols},1fr)">${cards.map(c=>`
            <article class="card" data-src="${c.id}" data-show-items="${c.showItems||6}">
              <div class="card-top">
                <span class="src">${escapeHtml(c.name)}</span>
                <span class="acts">
                  <button class="expand" type="button" title="展开全部" aria-label="展开或收起">▾</button>
                  <span class="ico" style="color:${c.iconColor||g.color}">${flameIcon()}</span>
                </span>
              </div>
              <div class="ts"></div>
              <ul class="list"><div class="loading">加载中…</div></ul>
              <div class="more"></div>
            </article>`).join('')}
          </div>
        </section>`;
    }).join('');
    app.innerHTML = html;

    // 立即并行抓取全部数据源（hotboard 模式：浏览器直连）
    const cards = app.querySelectorAll('.card');
    const sources = [];
    CONFIG.groups.forEach(g => (g.cards||[]).forEach(c => sources.push(c)));
    const map = {};
    sources.forEach(s => map[s.id] = s);
    cards.forEach(card => {
      const src = map[card.dataset.src];
      if (src) loadSource(src, card);
    });

    // 自动刷新：每 refreshSeconds 轮询一次，只刷过期缓存
    const timer = setInterval(() => {
      CONFIG.groups.forEach(g => (g.cards||[]).forEach(s => {
        const el = document.querySelector(`.card[data-src="${s.id}"]`);
        if (el) loadSource(s, el);
      }));
    }, CONFIG.refreshSeconds * 1000);
    timers.push(timer);
  } catch (e) {
    status.textContent = '连接失败';
    app.innerHTML = '<div class="error-row">加载失败：' + escapeHtml(e.message) + '（请确认已部署边缘函数并绑定 KV）</div>';
  }
}

// toast 提示 + 卡片展开/收起（事件委托）
(function(){
  const t=document.createElement('div');t.className='toast';document.body.appendChild(t);
  let timer;
  function show(msg){t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800);}
  document.addEventListener('click',e=>{
    const btn = e.target.closest('.expand');
    if (btn) {
      const card = btn.closest('.card');
      if (!card) return;
      card.classList.toggle('expanded');
      const exp = card.classList.contains('expanded');
      btn.textContent = exp ? '▴' : '▾';
      btn.title = exp ? '收起' : '展开全部';
      const more = card.querySelector('.more');
      const n = card.querySelectorAll('.item').length;
      const showN = parseInt((card.dataset.showItems || '6'), 10);
      if (more) more.textContent = exp ? ('已展开 · 共 ' + n + ' 条') : ('TOP ' + Math.min(showN, n) + ' · 共 ' + n + ' 条');
      return;
    }
    const a=e.target.closest('a');
    if(a && (!a.href || a.href==='#')) { e.preventDefault(); show('该条目暂无跳转链接'); }
  });
})();

loadBoard();
</script>
</body>
</html>
