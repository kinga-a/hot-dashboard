<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>热点聚合看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 18l5-7 4 5 5-7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  /* Hallmark · dashboard · light-blue grid system · cool anchor (#2563eb)
   * 设计准则：浅色蓝系网格（非黑底暖橙模板）、平台品牌色作信息色、
   * 卡片以身份色条差异化、克制动效、排名前三才有重徽章 */
  :root{
    --bg:#f2f4f8;--card:#fff;--ink:#1c2333;--muted:#7b8496;--line:#e5e9f0;
    --accent:#2563eb;--red:#ef4444;--orange:#f97316;--amber:#eab308;--gray:#9aa3b2;
    --up:#dc2626;--down:#16a34a;
    --ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.65,.05,.36,1);
    --dur-fast:.15s;--dur-base:.28s;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:clip;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 18% 6%, rgba(37,99,235,.08), transparent 38%),
      radial-gradient(circle at 86% 12%, rgba(16,185,129,.07), transparent 34%),
      linear-gradient(#e7ebf2 1px, transparent 1px),
      linear-gradient(90deg, #e7ebf2 1px, transparent 1px);
    background-size:auto,auto,26px 26px,26px 26px;
    color:var(--ink);min-height:100vh;padding:28px 24px 48px;
  }
  .wrap{max-width:1280px;margin:0 auto;}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
  .masthead h1{font-size:26px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;}
  .masthead h1 .logo{width:38px;height:38px;border-radius:11px;flex:0 0 38px;background:linear-gradient(135deg,#2563eb,#4f46e5);display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,99,235,.28);}
  .masthead h1 .logo svg{width:22px;height:22px;}
  .masthead .sub{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.6;}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted);box-shadow:0 1px 3px rgba(16,24,40,.05);}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  .admin-link{margin-left:8px;font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;}
  .admin-link:hover{text-decoration:underline;}
  .mh-right{display:flex;align-items:center;gap:12px;}
  /* ===== 搜索 ===== */
  .search{position:relative;}
  .search .s-box{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 8px 0 13px;height:38px;width:250px;gap:8px;box-shadow:0 1px 3px rgba(16,24,40,.05);transition:border-color .15s,box-shadow .15s;}
  .search .s-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .search .s-box svg{width:15px;height:15px;color:#9aa3b2;flex:0 0 auto;}
  .search input{border:none;outline:none;font-size:16px;width:100%;background:transparent;color:var(--ink);} /* 16px 避免 iOS Safari 聚焦自动放大 */
  .search input::placeholder{color:#b4bcc9;font-size:13px;}
  .search .s-clear{border:none;background:#eef2f8;color:#7b8496;width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;display:none;place-items:center;flex:0 0 auto;}
  .search .s-clear.show{display:grid;}
  .search .s-clear:hover{background:#e2e8f2;color:var(--ink);}
  .search-panel{position:absolute;top:calc(100% + 8px);right:0;width:min(480px,90vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(16,24,40,.15);display:none;overflow:hidden;z-index:50;}
  .search-panel.show{display:block;}
  .sr-head{padding:10px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:#f8fafc;}
  .sr-list{max-height:min(60vh,420px);overflow-y:auto;}
  .sr-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #f0f2f7;font-size:13px;line-height:1.45;}
  .sr-item:first-child{border-top:none;}
  .sr-item a{color:var(--ink);text-decoration:none;min-width:0;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .sr-item a:hover{color:var(--accent);}
  .sr-tag{flex:0 0 auto;font-size:11px;color:#fff;border-radius:5px;padding:2px 7px;white-space:nowrap;font-weight:600;}
  .sr-hot{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap;}
  .sr-empty{padding:22px;text-align:center;color:#b4bcc9;font-size:13px;}
  .divider{height:1px;background:var(--line);margin:22px 0 6px;}

  .group{margin-top:34px;}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .group-head .tag{width:5px;height:20px;border-radius:3px;}
  .group-head h2{font-size:19px;font-weight:700;}
  .group-head .count{font-size:11.5px;color:var(--muted);background:#edf1f7;border-radius:999px;padding:3.5px 11px;font-weight:600;margin-left:auto;letter-spacing:.2px;}
  .group-head .gcollapse{width:26px;height:26px;}
  /* 分类折叠：collapsed 时隐藏整行卡片 */
  .group.collapsed .row{display:none;}
  .group.collapsed .group-head{margin-bottom:0;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-top:2.5px solid transparent;border-radius:14px;padding:16px 16px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.04);display:flex;flex-direction:column;min-width:0;transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out),border-color var(--dur-base);opacity:0;animation:cardRise .55s var(--ease-out) forwards;}
  .card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.19s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(n+6){animation-delay:.28s}
  @keyframes cardRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.10);border-color:#d5deec;border-top-color:inherit;}
  @media (prefers-reduced-motion: reduce){.card{animation:none;opacity:1;transition:none;}}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .card-top .src{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .card-top .src a{color:inherit;text-decoration:none;}
  .card-top .src a:hover{color:var(--accent);}
  .card-top .acts{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
  /* ===== 图标按钮（展开/折叠）===== */
  .icon-btn{display:grid;place-items:center;border:none;background:transparent;color:#9aa3b2;cursor:pointer;border-radius:8px;transition:background .15s,color .15s;}
  .icon-btn:hover{background:#eef2f8;color:var(--ink);}
  .icon-btn .chev{display:inline-flex;transition:transform .22s ease;}
  .icon-btn svg{width:14px;height:14px;}
  .card-top .expand{width:24px;height:24px;}
  .group-head .gcollapse{width:26px;height:26px;}
  /* 卡片：默认向下(可展开)，展开后旋转朝上(可收起) */
  .card.expanded .expand .chev{transform:rotate(180deg);}
  /* 分类：默认朝上(可收起)，折叠后朝下(可展开) */
  .gcollapse .chev{transform:rotate(180deg);}
  .group.collapsed .gcollapse .chev{transform:rotate(0);}
  .card-top .ico{flex:0 0 auto;}
  .card-top .ico svg{width:16px;height:16px;display:block;}
  .card .ts{font-size:11px;color:#b4bcc9;margin-bottom:8px;}
  .card .ts .err{color:#dc2626;}
  .card .list{list-style:none;display:flex;flex-direction:column;flex:1;}
  .card .item{display:flex;align-items:flex-start;gap:9px;padding:6px 7px;margin:1px -7px;border-radius:8px;border-top:1px solid #f0f2f7;font-size:13.5px;line-height:1.5;transition:background var(--dur-fast) ease;}
  .card .item:hover{background:#f6f8fc;}
  .card .item:first-child{border-top:none;}
  /* 行情行：名称 + 点位 + 涨跌（红涨绿跌，国内习惯） */
  .item.q{align-items:center;gap:8px;}
  .item.q a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-num{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .q-chg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .q-chg.up{color:var(--up);}.q-chg.down{color:var(--down);}
  /* 折叠：超出 showItems 的条目默认隐藏，卡片 expanded 时显示 */
  .card .item.x{display:none;}
  .card.expanded .item.x{display:flex;}
  .card .item a{color:var(--ink);text-decoration:none;min-width:0;flex:1;}
  .card .item a:hover{color:var(--accent);}
  .rank{flex:0 0 17px;width:17px;height:17px;border-radius:4.5px;font-size:11px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:2px;}
  .r1{background:var(--red);}.r2{background:var(--orange);}.r3{background:var(--amber);}
  /* 第 4 名以后降级为轻量数字，保持前三的视觉权威 */
  .r4{background:transparent;color:#9aa3b2;font-weight:600;}
  .item .hot{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--muted);padding-left:6px;white-space:nowrap;}
  .card .empty{color:#b4bcc9;font-size:13px;padding:16px 0;text-align:center;flex:1;}
  .card .loading{color:#b4bcc9;font-size:13px;padding:16px 0;text-align:center;flex:1;}
  .card .more{text-align:right;font-size:11.5px;color:#b4bcc9;margin-top:10px;}
  .loading-row{color:#777;padding:24px;font-size:14px;}
  .error-row{color:#dc2626;padding:16px;font-size:13.5px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;}
  .foot{text-align:center;color:#a6aebb;font-size:12px;margin-top:44px;line-height:1.7;}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#1c2333;color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.22);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:99;max-width:80vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:1279px){
    /* 桌面以下自动降列：卡片换行排列，不再横向挤压滚动 */
    .row{grid-template-columns:repeat(auto-fit,minmax(250px,1fr)) !important;}
  }
  @media (max-width:640px){
    body{padding:20px 14px 40px;}
    .masthead h1{font-size:22px;}
    .mh-right{width:100%;flex-wrap:wrap;gap:10px;}
    .search{width:100%;}
    .search .s-box{width:100%;}
    .search-panel{width:100%;right:auto;left:0;}
    /* 手机端单列竖排：每张卡片完整可读 */
    .row{grid-template-columns:repeat(1,1fr) !important;}
    .card{padding:15px 15px 12px;}
    .card .item{font-size:13.5px;padding:6.5px 0;}
    .card .hot{max-width:38%;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>
        <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17l6-8 5 6 5-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        热点聚合看板
      </h1>
      <div class="sub">全网热搜 · 体育赛事 · 影视动态 · 每日资讯 一站式预览</div>
    </div>
    <div class="mh-right">
      <div class="pill"><span class="dot"></span><span id="status">加载中…</span><a class="admin-link" href="/admin.html">管理</a></div>
      <div class="search">
        <span class="s-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索新闻标题…" autocomplete="off" />
          <button id="searchClear" class="s-clear" type="button" aria-label="清空">×</button>
        </span>
        <div id="searchPanel" class="search-panel"></div>
      </div>
    </div>
  </header>
  <div class="divider"></div>
  <div id="app"><div class="loading-row">正在加载看板数据…</div></div>
  <div class="foot">热点聚合看板 · 浏览器直连数据源 · 会话缓存 · 自动刷新（参考 hotboard 架构）</div>
</div>

<script>
/* ===== 配置：数据源直连抓取，会话缓存，自动刷新 ===== */
const rankCls = (i) => i===0?'r1':i===1?'r2':i===2?'r3':'r4';
const API_CODELIFE = 'https://api.codelife.cc/api/top/list';
const CACHE_PREFIX = 'hb:';
const CACHE_TTL = 0; // 0 表示以 refreshSeconds 为准

let CONFIG = { refreshSeconds: 600, groups: [] };
let timers = [];
const BOARD_DATA = {}; // id -> {src, items}，供搜索使用
function storeData(src, items){ if (items && items.length) BOARD_DATA[src.id] = { src, items }; }

function flameIcon(){return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4.5 4 8.5a4 4 0 0 1-8 0C8 6.5 12 2 12 2z"/><path d="M12 22c4 0 6.5-2.5 6.5-6 0-2-1-4-2.5-5.5-.3 1.5-1 3-2 4 0-2.5-.8-5-2.6-7C10.4 9 9 11.6 9 13.6c0 2.5-1.6 3.4-1.6 3.4S6 16 6 16.6C6 20 8 22 12 22z"/></svg>';}
function quoteIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5l5.5-6 4 3.5 6.5-8.5"/><path d="M15 6.5h4.5V11"/></svg>';}

/* 会话缓存：先展示旧数据，后台刷新后覆盖 */
function cacheGet(key){
  try {
    const raw = sessionStorage.getItem(CACHE_PREFIX + key);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function cacheSet(key, val){
  try { sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify(val)); } catch(e){}
}

/* 构造请求 URL：codelife 加 timestamp 绕过 CDN 缓存；其他接口原样 */
function buildUrl(src){
  let url = src.url || '';
  if (!url) return '';
  if (url.includes('api.codelife.cc')) {
    url += (url.includes('?') ? '&' : '?') + 'timestamp=' + Date.now();
  }
  return url;
}

/* 通用解析：支持 codelife {code,data:[{title,hotValue,link}]} 与自定义字段映射 */
function parseItems(src, data){
  let arr = data;
  if (src.listPath) {
    arr = src.listPath.split('.').reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : null, data);
  } else if (Array.isArray(data)) {
    arr = data;
  } else if (data && Array.isArray(data.data)) {
    arr = data.data;
  }
  if (!Array.isArray(arr)) arr = [];
  const titleField = src.titleField || 'title';
  const urlField = src.urlField || 'url';
  return arr.map((it, idx) => ({
    rank: it.index || (idx + 1),
    title: it[titleField] !== undefined ? it[titleField] : (it.title || it.name || ''),
    url: it[urlField] !== undefined ? it[urlField] : (it.link || it.url || ''),
    hot: it.hotValue !== undefined ? it.hotValue : (it.hot || it.num || '')
  })).filter(t => t.title);
}

/* 腾讯行情解析：返回 v_code="字段~或," 行；指数 ~ 分隔、外盘 , 分隔；GBK 已由调用方解码 */
function parseQuoteResponse(text, src){
  const out = [];
  const seg = text.split(';');
  for (const line of seg) {
    const m = line.match(/v_([^=]+)="([^"]*)"/);
    if (!m) continue;
    const code = m[1], raw = m[2];
    if (!raw) continue;
    let f, name, price, prev, change, pct;
    if (raw.includes('~')) {
      f = raw.split('~');
      name = f[1] || '';
      price = parseFloat(f[3]);
      prev = parseFloat(f[4]);
      change = parseFloat(f[31]);
      pct = parseFloat(f[32]);
    } else {
      f = raw.split(',');
      name = f[13] || '';
      price = parseFloat(f[0]);
      prev = parseFloat(f[7]);
      change = price - prev;
      pct = parseFloat(f[1]);
    }
    if (!name || isNaN(price)) continue;
    const idx = (src.symbols || []).indexOf(code);
    const title = (src.names && src.names[idx]) || name;
    out.push({ rank: idx + 1, title, price, change, pct, url: 'https://gu.qq.com/' + code });
  }
  return out;
}

function fmtQuote(n){
  if (isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 100000) return (n/10000).toFixed(1) + '万';
  return n.toFixed(2);
}

/* 抓取单个数据源：先回缓存渲染，再后台刷新 */
async function loadSource(src, el){
  const key = src.id;
  const cached = cacheGet(key);
  const now = Date.now();
  const staleMs = (CONFIG.refreshSeconds || 600) * 1000;

  // 缓存未过期：直接渲染缓存，不重复请求
  if (cached && cached.t && (now - cached.t) < staleMs) {
    storeData(src, cached.items);
    renderCard(el, src, cached.items, cached.t, null);
    return;
  }

  // 有缓存但过期：先展示旧数据（标注抓取时间），再后台刷新
  if (cached && cached.items) {
    storeData(src, cached.items);
    renderCard(el, src, cached.items, cached.t, null);
  } else {
    el.querySelector('.list').innerHTML = '<div class="loading">加载中…</div>';
  }

  try {
    const url = buildUrl(src);
    if (!url) throw new Error('接口 URL 为空');
    const opt = { signal: AbortSignal.timeout(15000) };
    if (src.headers) {
      try { opt.headers = JSON.parse(src.headers); } catch(e){}
    }
    const res = await fetch(url, opt);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    let items;
    if (src.type === 'quote') {
      // 行情接口：GBK 编码，需解码后按腾讯格式解析
      const buf = await res.arrayBuffer();
      const text = new TextDecoder('gbk').decode(buf);
      items = parseQuoteResponse(text, src);
    } else {
      const json = await res.json();
      items = parseItems(src, json);
    }
    if (!items.length) throw new Error('解析结果为空');
    const entry = { t: Date.now(), items };
    cacheSet(key, entry);
    storeData(src, items);
    renderCard(el, src, items, entry.t, null);
  } catch (e) {
    // 刷新失败：保留旧数据并标注
    if (cached && cached.items) {
      renderCard(el, src, cached.items, cached.t, '刷新失败，展示 ' + (CONFIG.refreshSeconds/60) + ' 分钟前数据');
    } else {
      renderCard(el, src, [], 0, '加载失败：' + e.message);
    }
  }
}

function renderCard(el, src, items, t, err){
  const show = src.showItems || 6;
  const list = el.querySelector('.list');
  const tsEl = el.querySelector('.ts');
  const btn = el.querySelector('.expand');
  const expanded = el.classList.contains('expanded');
  if (btn) {
    btn.title = expanded ? '收起' : '展开全部';
    btn.style.display = (items && items.length > show) ? '' : 'none';
  }
  if (err) {
    tsEl.innerHTML = '<span class="err">' + escapeHtml(err) + '</span>';
  } else if (t) {
    const d = new Date(t);
    tsEl.textContent = '抓取于 ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  } else {
    tsEl.textContent = '';
  }
  if (!items || !items.length) {
    list.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  // 行情卡片：名称 + 点位 + 涨跌（红涨绿跌）
  if (src.type === 'quote') {
    list.innerHTML = items.map(t2=>{
      const up = t2.change >= 0;
      return `
    <li class="item q">
      <a href="${safeUrl(t2.url)}" target="_blank" rel="noopener" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</a>
      <span class="q-num">${fmtQuote(t2.price)}</span>
      <span class="q-chg ${up?'up':'down'}">${up?'+':''}${fmtQuote(t2.change)} ${t2.pct>=0?'+':''}${(!isNaN(t2.pct)?t2.pct.toFixed(2):'—')}%</span>
    </li>`;}).join('');
    const more = el.querySelector('.more');
    if (more) more.textContent = 'TOP ' + items.length + ' · 实时行情';
    return;
  }
  // 全部条目渲染，超出 showItems 的加 .x 类，由 .expanded 控制显隐
  list.innerHTML = items.map((t2,i)=>`
    <li class="item${i>=show?' x':''}">
      <span class="rank ${rankCls(i)}">${t2.rank||i+1}</span>
      <a href="${safeUrl(t2.url)}" target="_blank" rel="noopener" title="${escapeHtml(t2.title)}">${escapeHtml(t2.title)}</a>
      ${t2.hot ? `<span class="hot">${escapeHtml(String(t2.hot))}</span>` : ''}
    </li>`).join('');
  const more = el.querySelector('.more');
  if (more) {
    if (items.length > show) {
      more.textContent = expanded ? ('已展开 · 共 ' + items.length + ' 条') : ('TOP ' + show + ' · 共 ' + items.length + ' 条');
    } else {
      more.textContent = 'TOP ' + Math.min(show, items.length);
    }
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u){
  try {
    const x = new URL(u, location.origin);
    if (!/^https?:$/.test(x.protocol)) return '#';
    return x.href;
  } catch(e){ return '#'; }
}

async function loadBoard(){
  const app = document.getElementById('app');
  const status = document.getElementById('status');
  try {
    const res = await fetch('/api/board');
    if (!res.ok) throw new Error('API ' + res.status);
    const board = await res.json();
    CONFIG = { refreshSeconds: board.refreshSeconds || 600, groups: board.groups || [] };
    status.textContent = '已连接 · 每 ' + (CONFIG.refreshSeconds/60) + ' 分钟自动刷新';
    if (!CONFIG.groups.length) {
      app.innerHTML = '<div class="error-row">暂无任何分类，请先到后台「管理」添加分类和数据源。</div>';
      return;
    }
    // 清理旧定时器
    timers.forEach(t=>clearInterval(t)); timers = [];
    // 渲染骨架
    const html = CONFIG.groups.map(g=>{
      const cols = Math.min(Math.max(g.cardCount||5,1),5);
      const cards = g.cards || [];
      return `
        <section class="group">
          <div class="group-head"><span class="tag" style="background:${g.color}"></span><h2>${escapeHtml(g.name)}</h2><span class="count">${cards.length} 个数据源</span><button class="gcollapse icon-btn" type="button" title="折叠分类" aria-label="折叠或展开分类"><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button></div>
          <div class="row" style="grid-template-columns:repeat(${cols},1fr)">${cards.map(c=>`
            <article class="card" data-src="${c.id}" data-show-items="${c.showItems||6}" style="border-top-color:${c.iconColor||g.color}">
              <div class="card-top">
                <span class="src">${escapeHtml(c.name)}</span>
                <span class="acts">
                  <button class="expand icon-btn" type="button" title="展开全部" aria-label="展开或收起"><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button>
                  <span class="ico" style="color:${c.iconColor||g.color}">${c.type==='quote'?quoteIcon():flameIcon()}</span>
                </span>
              </div>
              <div class="ts"></div>
              <ul class="list"><div class="loading">加载中…</div></ul>
              <div class="more"></div>
            </article>`).join('')}
          </div>
        </section>`;
    }).join('');
    app.innerHTML = html;

    // 立即并行抓取全部数据源（hotboard 模式：浏览器直连）
    const cards = app.querySelectorAll('.card');
    const sources = [];
    CONFIG.groups.forEach(g => (g.cards||[]).forEach(c => sources.push(c)));
    const map = {};
    sources.forEach(s => map[s.id] = s);
    cards.forEach(card => {
      const src = map[card.dataset.src];
      if (src) loadSource(src, card);
    });

    // 自动刷新：每 refreshSeconds 轮询一次，只刷过期缓存
    const timer = setInterval(() => {
      CONFIG.groups.forEach(g => (g.cards||[]).forEach(s => {
        const el = document.querySelector(`.card[data-src="${s.id}"]`);
        if (el) loadSource(s, el);
      }));
    }, CONFIG.refreshSeconds * 1000);
    timers.push(timer);
  } catch (e) {
    status.textContent = '连接失败';
    app.innerHTML = '<div class="error-row">加载失败：' + escapeHtml(e.message) + '（请确认已部署边缘函数并绑定 KV）</div>';
  }
}

// toast 提示 + 卡片展开/收起 + 分类折叠（事件委托）
(function(){
  const t=document.createElement('div');t.className='toast';document.body.appendChild(t);
  let timer;
  function show(msg){t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800);}
  document.addEventListener('click',e=>{
    // 分类整体折叠
    const gb = e.target.closest('.gcollapse');
    if (gb) {
      const group = gb.closest('.group');
      if (!group) return;
      group.classList.toggle('collapsed');
      gb.title = group.classList.contains('collapsed') ? '展开分类' : '折叠分类';
      return;
    }
    const btn = e.target.closest('.expand');
    if (btn) {
      const card = btn.closest('.card');
      if (!card) return;
      card.classList.toggle('expanded');
      const exp = card.classList.contains('expanded');
      btn.title = exp ? '收起' : '展开全部';
      const more = card.querySelector('.more');
      const n = card.querySelectorAll('.item').length;
      const showN = parseInt((card.dataset.showItems || '6'), 10);
      if (more) more.textContent = exp ? ('已展开 · 共 ' + n + ' 条') : ('TOP ' + Math.min(showN, n) + ' · 共 ' + n + ' 条');
      return;
    }
    const a=e.target.closest('a');
    if(a && (!a.href || a.href==='#')) { e.preventDefault(); show('该条目暂无跳转链接'); }
  });
})();

/* ===== 新闻搜索 ===== */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchPanel = document.getElementById('searchPanel');
let searchTimer = null;

function closeSearch(){
  searchPanel.classList.remove('show');
  searchPanel.innerHTML = '';
}
function runSearch(){
  const q = (searchInput.value || '').trim().toLowerCase();
  if (!q) { searchClear.classList.remove('show'); closeSearch(); return; }
  searchClear.classList.add('show');
  const results = [];
  for (const id in BOARD_DATA) {
    const d = BOARD_DATA[id];
    for (const it of d.items) {
      const title = String(it.title || '');
      if (title.toLowerCase().includes(q)) results.push({ src: d.src, it });
    }
  }
  if (!results.length) {
    searchPanel.innerHTML = '<div class="sr-empty">未找到包含「' + escapeHtml(q) + '」的新闻</div>';
  } else {
    const top = results.slice(0, 120);
    searchPanel.innerHTML = '<div class="sr-head">在 ' + Object.keys(BOARD_DATA).length + ' 个数据源中找到 ' + results.length + ' 条相关新闻' + (results.length > top.length ? '（显示前 ' + top.length + ' 条）' : '') + '</div><div class="sr-list">' + top.map(r => `
      <div class="sr-item">
        <span class="sr-tag" style="background:${r.src.iconColor||'#2563eb'}">${escapeHtml(r.src.name)}</span>
        <a href="${safeUrl(r.it.url)}" target="_blank" rel="noopener" title="${escapeHtml(r.it.title)}">${escapeHtml(r.it.title)}</a>
        ${r.it.hot ? `<span class="sr-hot">${escapeHtml(String(r.it.hot))}</span>` : ''}
      </div>`).join('') + '</div>';
  }
  searchPanel.classList.add('show');
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 200);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(); }
  if (e.key === 'Escape') { searchInput.value = ''; closeSearch(); searchClear.classList.remove('show'); }
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  closeSearch();
  searchClear.classList.remove('show');
  searchInput.focus();
});
// 点击搜索框外部关闭结果面板
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) closeSearch();
});

loadBoard();
</script>
