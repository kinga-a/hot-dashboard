<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>看板管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2333'/%3E%3Cpath d='M6 16h7v7H6zM13 16h7v7h-7zM20 16h7v7h-7z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{--bg:#f4f5f8;--card:#fff;--ink:#1c2333;--muted:#7b8496;--line:#e5e9f0;--accent:#2563eb;--danger:#dc2626;--ok:#16a34a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px;}
  .wrap{max-width:960px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  header h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;}
  header h1 svg{width:24px;height:24px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#1d4ed8;}
  .btn-ghost{background:#eef2f7;color:var(--ink);}
  .btn-ghost:hover{background:#e2e8f0;}
  .btn-danger{background:#fef2f2;color:var(--danger);}
  .btn-danger:hover{background:#fee2e2;}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05);}
  .card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .grp{border-left:4px solid var(--accent);}
  .grp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .grp-head .name{font-size:16px;font-weight:700;flex:1;min-width:120px;}
  .grp-head .info{font-size:12.5px;color:var(--muted);}
  .src-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fafbfd;flex-wrap:wrap;}
  .src-row .nm{font-weight:600;font-size:13.5px;}
  .src-row .url{color:var(--muted);font-size:12px;flex:1;min-width:140px;word-break:break-all;}
  .src-row .meta{font-size:12px;color:var(--muted);}
  .src-row .ops{margin-left:auto;display:flex;gap:6px;}
  .src-row .ops .btn{padding:3px 8px;font-size:12px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px;font-family:inherit;background:#fff;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .modal.show{display:flex;}
  .modal-box{background:#fff;border-radius:16px;padding:22px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-box h3{margin-bottom:16px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .token-box{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;word-break:break-all;}
  .msg{padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px;display:none;}
  .msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0;display:block;}
  .msg.err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block;}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}body{padding:16px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" fill="#1c2333"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      看板管理后台
    </h1>
    <div>
      <button class="btn btn-ghost" onclick="toggleToken()">配置 Token</button>
      <a class="btn btn-ghost" href="/">← 返回看板</a>
    </div>
  </header>

  <div id="msg"></div>

  <div class="card">
    <h3>全局设置</h3>
    <div class="row2">
      <div class="field">
        <label>数据自动刷新间隔（秒）</label>
        <input type="number" id="refresh" min="30" step="30" />
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveRefresh()">保存刷新设置</button>
    <button class="btn btn-ghost" onclick="clearCache()">清除数据缓存</button>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <h3 style="margin-bottom:0;">分类管理</h3>
      <button class="btn btn-primary" onclick="openGroupModal()">+ 新建分类</button>
    </div>
    <div id="groups" class="mt"></div>
  </div>

  <div class="hint" style="margin-top:20px;text-align:center;">
    分类可新建 / 删除 / 上移下移排序；每个分类可设置卡片数量（1~5）与显示条数。<br/>
    数据源为任意返回 JSON 的榜单接口，可配置列表路径与标题/链接字段。
  </div>
</div>

<!-- 新建分类弹窗 -->
<div class="modal" id="groupModal">
  <div class="modal-box">
    <h3 id="groupModalTitle">新建分类</h3>
    <div class="field"><label>分类名称</label><input id="gName" placeholder="如：热点新闻" /></div>
    <div class="row2">
      <div class="field"><label>分类颜色</label><input type="color" id="gColor" value="#2563eb" /></div>
      <div class="field"><label>卡片数量（1~5）</label><input type="number" id="gCount" min="1" max="5" value="5" /></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('groupModal')">取消</button>
      <button class="btn btn-primary" onclick="saveGroup()">保存</button>
    </div>
  </div>
</div>

<!-- 添加数据源弹窗 -->
<div class="modal" id="srcModal">
  <div class="modal-box">
    <h3 id="srcModalTitle">添加数据源</h3>
    <input type="hidden" id="sGroupId" />
    <input type="hidden" id="sId" />
    <div class="field"><label>数据源名称</label><input id="sName" placeholder="如：微博热搜" /></div>
    <div class="field"><label>接口 URL</label><input id="sUrl" placeholder="https://example.com/api/hot" /></div>
    <div class="row3">
      <div class="field"><label>列表路径（可选）</label><input id="sPath" placeholder="如 data.list" /></div>
      <div class="field"><label>标题字段</label><input id="sTitle" value="title" /></div>
      <div class="field"><label>链接字段</label><input id="sUrlField" value="url" /></div>
    </div>
    <div class="row3">
      <div class="field"><label>卡片内显示条数</label><input type="number" id="sShow" min="1" max="20" value="6" /></div>
      <div class="field"><label>图标颜色</label><input type="color" id="sColor" value="#2563eb" /></div>
      <div class="field"><label>自定义请求头(可选)</label><input id="sHeaders" placeholder='{"User-Agent":"Mozilla/5.0"}' /></div>
    </div>
    <div class="hint">列表路径：接口 JSON 中榜单数组所在位置，留空自动查找。标题字段=标题、链接字段=跳转链接。</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('srcModal')">取消</button>
      <button class="btn btn-primary" onclick="saveSource()">保存数据源</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('board_token') || '';
let CONFIG = { refreshSeconds: 600, groups: [] };

function setMsg(text, type){
  const m = document.getElementById('msg');
  m.className = 'msg ' + (type||'ok');
  m.textContent = text;
  setTimeout(()=>{ m.className='msg'; }, 3000);
}

async function api(action, payload){
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/api/admin', { method:'POST', headers, body: JSON.stringify({ action, ...payload }) });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || '请求失败');
  return data.result;
}

async function load(){
  try {
    CONFIG = await api('get');
    document.getElementById('refresh').value = CONFIG.refreshSeconds || 600;
    renderGroups();
  } catch(e){
    if (String(e.message).includes('未授权')){
      setMsg('需要先配置 ADMIN_TOKEN 才能管理', 'err');
    } else {
      setMsg('加载失败：' + e.message, 'err');
    }
  }
}

function renderGroups(){
  const box = document.getElementById('groups');
  if (!CONFIG.groups || !CONFIG.groups.length){
    box.innerHTML = '<div class="empty">还没有分类，点击「+ 新建分类」开始。</div>';
    return;
  }
  box.innerHTML = CONFIG.groups.map((g,gi)=>{
    const srcs = (g.sources||[]).map(s=>`
      <div class="src-row">
        <span class="nm">${s.name}</span>
        <span class="url" title="${s.url}">${s.url}</span>
        <span class="meta">显示${s.showItems||6}条 · ${s.enabled===false?'停用':'启用'}</span>
        <span class="ops">
          <button class="btn btn-ghost" onclick="editSource('${g.id}','${s.id}')">编辑</button>
          <button class="btn btn-danger" onclick="deleteSource('${g.id}','${s.id}')">删</button>
        </span>
      </div>`).join('');
    return `
      <div class="grp card" style="border-left-color:${g.color}">
        <div class="grp-head">
          <span class="name">${g.name}</span>
          <span class="info">卡片 ${g.cardCount||5} 张 · ${srcs.length} 个数据源</span>
          <button class="btn btn-ghost btn-sm" onclick="moveGroup('${g.id}','up')" ${gi===0?'disabled':''}>↑上移</button>
          <button class="btn btn-ghost btn-sm" onclick="moveGroup('${g.id}','down')" ${gi===CONFIG.groups.length-1?'disabled':''}>↓下移</button>
          <button class="btn btn-ghost btn-sm" onclick="openEditGroup('${g.id}')">设置</button>
          <button class="btn btn-danger btn-sm" onclick="deleteGroup('${g.id}')">删除</button>
          <button class="btn btn-primary btn-sm" onclick="openSourceModal('${g.id}')">+ 添加数据源</button>
        </div>
        <div>${srcs}</div>
      </div>`;
  }).join('');
}

// ===== 分类 =====
function openGroupModal(){
  document.getElementById('groupModalTitle').textContent = '新建分类';
  document.getElementById('gName').value=''; document.getElementById('gColor').value='#2563eb';
  document.getElementById('gCount').value='5';
  document.getElementById('groupModal').classList.add('show');
}
let editGroupId = null;
function openEditGroup(gid){
  const g = CONFIG.groups.find(x=>x.id===gid);
  if (!g) return;
  editGroupId = gid;
  document.getElementById('groupModalTitle').textContent = '编辑分类';
  document.getElementById('gName').value=g.name; document.getElementById('gColor').value=g.color;
  document.getElementById('gCount').value=g.cardCount||5;
  document.getElementById('groupModal').classList.add('show');
}
async function saveGroup(){
  try {
    if (editGroupId){
      await api('renameGroup',{ groupId:editGroupId,
        name:document.getElementById('gName').value,
        color:document.getElementById('gColor').value,
        cardCount:document.getElementById('gCount').value });
    } else {
      await api('addGroup',{ name:document.getElementById('gName').value,
        color:document.getElementById('gColor').value,
        cardCount:document.getElementById('gCount').value });
    }
    closeModal('groupModal'); editGroupId=null; setMsg('分类已保存'); await load();
  } catch(e){ setMsg(e.message,'err'); }
}
async function moveGroup(gid,dir){
  try { await api('moveGroup',{groupId:gid,dir}); await load(); } catch(e){ setMsg(e.message,'err'); }
}
async function deleteGroup(gid){
  if(!confirm('确定删除该分类及其所有数据源？')) return;
  try { await api('deleteGroup',{groupId:gid}); setMsg('分类已删除'); await load(); } catch(e){ setMsg(e.message,'err'); }
}

// ===== 数据源 =====
function openSourceModal(gid){
  document.getElementById('srcModalTitle').textContent='添加数据源';
  document.getElementById('sGroupId').value=gid; document.getElementById('sId').value='';
  ['sName','sUrl','sPath','sHeaders'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('sTitle').value='title'; document.getElementById('sUrlField').value='url';
  document.getElementById('sShow').value='6'; document.getElementById('sColor').value='#2563eb';
  document.getElementById('srcModal').classList.add('show');
}
function editSource(gid,sid){
  const g=CONFIG.groups.find(x=>x.id===gid); const s=(g.sources||[]).find(x=>x.id===sid);
  if(!s) return;
  document.getElementById('srcModalTitle').textContent='编辑数据源';
  document.getElementById('sGroupId').value=gid; document.getElementById('sId').value=sid;
  document.getElementById('sName').value=s.name; document.getElementById('sUrl').value=s.url;
  document.getElementById('sPath').value=s.listPath||''; document.getElementById('sTitle').value=s.titleField||'title';
  document.getElementById('sUrlField').value=s.urlField||'url'; document.getElementById('sShow').value=s.showItems||6;
  document.getElementById('sColor').value=s.iconColor||'#2563eb'; document.getElementById('sHeaders').value=s.headers||'';
  document.getElementById('srcModal').classList.add('show');
}
async function saveSource(){
  try {
    const gid=document.getElementById('sGroupId').value, sid=document.getElementById('sId').value;
    const payload={ groupId:gid, sourceId:sid, name:document.getElementById('sName').value,
      url:document.getElementById('sUrl').value, listPath:document.getElementById('sPath').value,
      titleField:document.getElementById('sTitle').value, urlField:document.getElementById('sUrlField').value,
      showItems:document.getElementById('sShow').value, iconColor:document.getElementById('sColor').value,
      headers:document.getElementById('sHeaders').value };
    if (sid) await api('updateSource',payload); else await api('addSource',payload);
    closeModal('srcModal'); setMsg('数据源已保存'); await load();
  } catch(e){ setMsg(e.message,'err'); }
}
async function deleteSource(gid,sid){
  if(!confirm('删除该数据源？')) return;
  try { await api('deleteSource',{groupId:gid,sourceId:sid}); setMsg('数据源已删除'); await load(); } catch(e){ setMsg(e.message,'err'); }
}

// ===== 全局 =====
async function saveRefresh(){
  try { await api('setRefresh',{refreshSeconds:document.getElementById('refresh').value}); setMsg('刷新间隔已保存'); } catch(e){ setMsg(e.message,'err'); }
}
async function clearCache(){
  try { await api('clearCache'); setMsg('已清除全部数据缓存'); } catch(e){ setMsg(e.message,'err'); }
}

function toggleToken(){
  const token = prompt('请输入管理 Token（ADMIN_TOKEN）：', TOKEN);
  if (token !== null){
    TOKEN = token; localStorage.setItem('board_token', token);
    setMsg('Token 已保存'); load();
  }
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal('groupModal'); closeModal('srcModal'); } });

load();
</script>
</body>
</html>
